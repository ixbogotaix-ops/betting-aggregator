version: '3.8'

services:
  backend:
    image: betting_aggregator-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./backend/betting_db.sqlite:/app/betting_db.sqlite
    networks:
      - app-network

  frontend:
    image: betting_aggregator-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "8444:8444"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
