limit_req_zone $binary_remote_addr zone=apilimit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=synclimit:5m rate=1r/m;

# HTTP Server (Port 80)
server {
    listen 80;
    server_name dthenbk.duckdns.org localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 5M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Timeouts for DDoS / Slowloris mitigation
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Protected sync endpoint (rate limited: 1 req/min per IP)
    location = /api/sources/sync {
        limit_req zone=synclimit burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/sources/sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API proxy with rate limiting (15 req/sec with burst)
    location /api/ {
        limit_req zone=apilimit burst=25 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS Server (Port 8444)
server {
    listen 8444 ssl;
    server_name dthenbk.duckdns.org localhost;

    ssl_certificate /etc/letsencrypt/live/dthenbk.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dthenbk.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 5M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Timeouts for DDoS / Slowloris mitigation
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Protected sync endpoint (rate limited: 1 req/min per IP)
    location = /api/sources/sync {
        limit_req zone=synclimit burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/sources/sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API proxy with rate limiting (15 req/sec with burst)
    location /api/ {
        limit_req zone=apilimit burst=25 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
