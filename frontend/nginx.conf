limit_req_zone $binary_remote_addr zone=apilimit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=synclimit:5m rate=1r/m;

# HTTP Server (Port 80)
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 5M;

    # GZIP Compression (Level 1 for lightning speed, low CPU)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 1;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Timeouts for reliable data streaming
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # Static assets caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Protected sync endpoint (rate limited: 1 req/min per IP)
    location = /api/sources/sync {
        limit_req zone=synclimit burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/sources/sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # General API proxy with rate limiting (15 req/sec with burst)
    location /api/ {
        limit_req zone=apilimit burst=25 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffers 8 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 128k;
    }
}

# HTTPS Server (Port 8444)
server {
    listen 8444 ssl;
    server_name dthenbk.duckdns.org localhost;

    ssl_certificate /etc/letsencrypt/live/dthenbk.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dthenbk.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

